services:
  - type: web
    name: cardiosignal-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FRONTEND_ORIGIN
        value: https://cardio-signal.vercel.app
